# TODO: verify that the list<float32> `embedding` column survives
# BaseDataset loading and caching; fall back to a string column if not.
version: "1.0"
tables:
  clinical:
    file_path: "clinical.csv"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "project"
      - "sex"
      - "age"
      - "race"
      - "ethnicity"
      - "vital_status"
      - "days_to_death"
      - "days_to_last_follow_up"
  expr:
    file_path: "embeddings/expr.parquet"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "embedding"
      - "n_sources"
  hist:
    file_path: "embeddings/hist.parquet"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "embedding"
      - "n_sources"
  text:
    file_path: "embeddings/text.parquet"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "embedding"
      - "n_sources"
