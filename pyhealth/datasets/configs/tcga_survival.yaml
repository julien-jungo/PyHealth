# TCGA multimodal survival cohort (Song et al., ML4H 2025).
# Every file below is written by TCGAMultimodalDataset.prepare_metadata() from
# clinical.csv, split_cases.csv, and
# embeddings/<modality>/<case_id>/<file_id>.npy.
# Every table keys patients by case_id, mapped to PyHealth's patient_id.
# A column that is not listed under `attributes` is dropped by BaseDataset, so
# the clinical table lists every column of the authors' clinical.csv (checked
# against data/clinical.csv of multimodal-cancer-modeling), plus the fold (the
# split column of split_cases.csv).

version: "1.0"
tables:
  clinical:
    file_path: "tcga_multimodal_clinical-pyhealth.csv"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "project"
      - "sex"
      - "age"
      - "race"
      - "ethnicity"
      - "vital_status"
      - "days_to_death"
      - "days_to_last_follow_up"
      - "fold"
  expr:
    file_path: "tcga_multimodal_expr-pyhealth.csv"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "file_id"
      - "embedding_path"
  hist:
    file_path: "tcga_multimodal_hist-pyhealth.csv"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "file_id"
      - "embedding_path"
  text:
    file_path: "tcga_multimodal_text-pyhealth.csv"
    patient_id: "case_id"
    timestamp: null
    attributes:
      - "file_id"
      - "embedding_path"
